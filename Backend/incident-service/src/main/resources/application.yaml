spring:
  application:
    name: incident-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/track_it}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Kafka Producer Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all  # Ensures message is written to all replicas
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true  # Prevents duplicate messages
        spring.json.add.type.headers: false  # Don't add type headers
    properties:
      # Common Kafka properties
      request.timeout.ms: 30000
      delivery.timeout.ms: 120000

server:
  port: ${PORT:8084}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.TrackIT: DEBUG
    org.springframework.web: INFO
    org.springframework.kafka: INFO  # Add Kafka logging
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true

app:
  jwt:
    secret: ${JWT_SECRET}
  internal-token: ${INTERNAL_TOKEN:notification-service-secret}
  independent-service:
    url: http://INDEPENDENT-SERVICES/api
  sla-service:
    url: http://SLA-SERVICE/api
  user-service:
    url: http://USER-SERVICE2/api

  # Kafka Topics Configuration
  kafka:
    topics:
      incident-events: incident-events