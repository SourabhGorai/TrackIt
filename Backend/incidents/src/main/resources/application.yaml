spring:
  application:
    name: incidents
datasource:
  url: ${DB_URL:jdbc:postgresql://localhost:5432/track_it}
  username: ${DB_USER}
  password: ${DB_PASS}
  driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${PORT:8084}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.TrackIT: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true