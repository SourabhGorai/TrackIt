spring:
  application:
    name: api-gateway

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  cloud:
    gateway:
      server:
        webflux:

          # ================= ROUTES =================
          routes:

            # ---------- USER SERVICE (PUBLIC) ----------
            - id: user-service-auth
              uri: lb://USER-SERVICE2
              predicates:
                - Path=/api/auth/**

            # ---------- USER SERVICE (PROTECTED) ----------
            - id: auth-register-protected
              uri: lb://USER-SERVICE2
              predicates:
                - Path=/api/auth/register
              filters:
                - AuthenticationFilter

            - id: user-service-users
              uri: lb://USER-SERVICE2
              predicates:
                - Path=/api/users/**
              filters:
                - AuthenticationFilter

            # ---------- INDEPENDENT SERVICES (PUBLIC) ----------
            - id: public-companies
              uri: lb://INDEPENDENT-SERVICES
              predicates:
                - Path=/api/companies/active

            - id: public-roles
              uri: lb://INDEPENDENT-SERVICES
              predicates:
                - Path=/api/roles

            # ---------- INDEPENDENT SERVICES (PROTECTED) ----------
            - id: independent-services-protected
              uri: lb://INDEPENDENT-SERVICES
              predicates:
                - Path=/api/**
              filters:
                - AuthenticationFilter

          # ================= CORS =================
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                exposedHeaders:
                  - Authorization
                allowCredentials: true
                maxAge: 3600

          # ================= DISCOVERY =================
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

server:
  port: 8080

# ================= JWT =================
jwt:
  secret: ${SECRET_KEY:local-dev-secret-key-32-chars-long}

# ================= EUREKA =================
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ================= ACTUATOR =================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes
  endpoint:
    health:
      show-details: always

# ================= LOGGING =================
logging:
  level:
    root: INFO
    com.trackIt: DEBUG
    org.springframework.cloud.gateway: DEBUG
