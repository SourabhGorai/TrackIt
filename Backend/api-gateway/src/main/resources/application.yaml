spring:
  application:
    name: api-gateway

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  cloud:
    gateway:
      # ================= CORS =================
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
            allowCredentials: true
            maxAge: 3600

      # ================= DISCOVERY =================
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

server:
  port: 8080

# ================= JWT =================
jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-32-chars-long}

# ================= INTERNAL SERVICE AUTH =================
app:
  internal-token: ${INTERNAL_TOKEN:notification-service-secret}

# ================= EUREKA =================
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ================= ACTUATOR =================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes
  endpoint:
    health:
      show-details: always

# ================= LOGGING =================
logging:
  level:
    root: INFO
    com.trackIt: DEBUG
    org.springframework.cloud.gateway: DEBUG